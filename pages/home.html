      <a class="navbar-brand nav__logo" href="#">
        <img src="../images/logo.png" width="100%" height="65" alt="" />

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item active">
            <a class="nav-link" href="#"
              >Home <span class="sr-only">(current)</span></a
            >
          </li>
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              href="#"
              id="navbarDropdown"
              role="button"
              data-toggle="dropdown"
              aria-haspopup="true"
              aria-expanded="false"
            >
              About
            </a>
            <div class="dropdown-menu" aria-labelledby="navbarDropdown">
              <a class="dropdown-item" href="#">About Us</a>
              <a class="dropdown-item" href="#">Comments</a>
              <a class="dropdown-item" href="#"> Our Team</a>
              <a class="dropdown-item" href="#">Foods & Bars</a>
              <a class="dropdown-item" href="#"> Amenities</a>
            </div>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="#"
              >Room List<span class="sr-only">(current)</span></a
            >
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="#"
              >Rooms Available <span class="sr-only">(current)</span></a
            >
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="#"
              >Bookings List <span class="sr-only">(current)</span></a
            >
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="#"
              >Blog <span class="sr-only">(current)</span></a
            >
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="#"
              >Contact <span class="sr-only">(current)</span></a
            >
          </li>
          <li class="nav-item nav__hamburger">
            <i class="bi bi-list"></i>
          </li>
          <li class="nav-item nav__book text-white pl-3 pr-3 pt-1 ml-3">
            <i class="fi fi-rr-calendar"></i>
            <b><p>Book Now +</p></b>
          </li>
        </ul>
      </div>
    </nav>

    <!-- !Hero -->

    <div class="hero">
      <div
        id="carouselExampleControls"
        class="carousel slide"
        data-ride="carousel"
      >
        <div class="carousel-inner">
          <!-- !Hero bg 1-->
          <div class="carousel-item active hero__page hero__page--1"></div>
          <!-- !Hero bg 2 -->
          <div class="carousel-item hero__page hero__page--2"></div>

          <!-- !Hero bg 3 -->
          <div class="carousel-item hero__page hero__page--3"></div>
        </div>
        <a
          class="carousel-control-prev"
          href="#carouselExampleControls"
          role="button"
          data-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a
          class="carousel-control-next"
          href="#carouselExampleControls"
          role="button"
          data-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>
      </div>
    </div>

    <script
